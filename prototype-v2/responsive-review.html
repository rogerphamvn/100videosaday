<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prototype v2 — responsive review harness</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: #e6e9e3; color: #151b19; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
    header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 62px; padding: 10px 16px; background: #f4f5f0; border-bottom: 1px solid #cfd6cf; }
    h1 { margin: 0 auto 0 0; font-size: 16px; }
    button { min-height: 44px; border: 1px solid #b9c3bb; border-radius: 8px; background: #fff; padding: 0 13px; color: #151b19; font: inherit; font-weight: 700; cursor: pointer; }
    button[aria-pressed="true"] { background: #151b19; color: #cffc93; border-color: #151b19; }
    button:focus-visible { outline: 3px solid #91ca4c; outline-offset: 2px; }
    .note { flex-basis: 100%; color: #5d6b64; font-size: 12px; }
    main { min-width: max-content; padding: 20px; }
    .frame-shell { width: max-content; padding: 8px; border-radius: 12px; background: #303936; box-shadow: 0 16px 40px rgba(20,30,26,.2); }
    .frame-label { display: flex; justify-content: space-between; padding: 3px 4px 9px; color: #dbe2de; font-size: 12px; }
    .diagnostics { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 0 4px 9px; color: #dbe2de; font: 12px/1.35 ui-monospace, Consolas, monospace; }
    .diagnostics output { color: #cffc93; }.diagnostics button { min-height: 44px; margin-left: auto; padding: 0 9px; font: 11px "Segoe UI", system-ui, sans-serif; }
    iframe { display: block; width: 390px; height: 900px; border: 0; background: #fff; transition: width 180ms ease; }
    @media (prefers-reduced-motion: reduce) { iframe { transition: none; } }
  </style>
</head>
<body>
  <header>
    <h1>Responsive review harness • same-origin iframe</h1>
    <button type="button" data-width="390" aria-pressed="true">390 px</button>
    <button type="button" data-width="768" aria-pressed="false">768 px</button>
    <button type="button" data-width="1440" aria-pressed="false">1440 px</button>
    <span class="note">Khung có chiều rộng CSS chính xác và cao 900px; đây là test reflow trong browser, không phải mô phỏng thiết bị vật lý, DPR, touch hoặc thanh trình duyệt.</span>
  </header>
  <main>
    <div class="frame-shell">
      <div class="frame-label"><span id="frame-size">390 × 900 CSS px</span><span>prototype-v2/index.html</span></div>
      <div class="diagnostics"><output id="layout-metrics" aria-live="polite">Đang đọc layout…</output><button type="button" id="read-layout">Đọc layout</button></div>
      <iframe id="preview-frame" title="Creative Hook Lab responsive preview" src="index.html"></iframe>
    </div>
  </main>
  <script>
    (() => {
      const frame = document.querySelector("#preview-frame");
      const label = document.querySelector("#frame-size");
      const metrics = document.querySelector("#layout-metrics");
      function readLayout() {
        try {
          const childWindow = frame.contentWindow;
          const doc = frame.contentDocument.documentElement;
          const overflow = Math.max(0, doc.scrollWidth - doc.clientWidth);
          metrics.textContent = `innerWidth=${childWindow.innerWidth}px • clientWidth=${doc.clientWidth}px • scrollWidth=${doc.scrollWidth}px • overflowX=${overflow}px`;
          metrics.dataset.overflow = String(overflow);
        } catch (error) {
          metrics.textContent = "Không đọc được same-origin child layout";
          metrics.dataset.overflow = "unavailable";
        }
      }
      function readAfterLayout() {
        requestAnimationFrame(() => requestAnimationFrame(readLayout));
      }
      document.querySelectorAll("[data-width]").forEach((button) => {
        button.addEventListener("click", () => {
          const width = Number(button.dataset.width);
          frame.style.width = `${width}px`;
          label.textContent = `${width} × 900 CSS px`;
          document.querySelectorAll("[data-width]").forEach((item) => item.setAttribute("aria-pressed", String(item === button)));
          readAfterLayout();
        });
      });
      frame.addEventListener("load", readAfterLayout);
      document.querySelector("#read-layout").addEventListener("click", readLayout);
    })();
  </script>
</body>
</html>
