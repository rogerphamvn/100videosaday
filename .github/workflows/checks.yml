name: Project checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install independent schema validator
        run: python -m pip install -r requirements-dev.txt
      - name: Check release artifacts and prompt contracts
        run: python scripts/check-release.py
      - name: Check prototype JavaScript syntax
        run: node --check prototype-v2/app.js
