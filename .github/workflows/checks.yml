name: Project checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install independent schema validator
        run: python -m pip install -r requirements-dev.txt
      - name: Verify compiled prompt validators
        run: |
          npm ci
          npm run build:validators
          git diff --exit-code -- cloudflare/prompt-validators.generated.mjs
          node scripts/test-prompt-runtime.mjs
      - name: Check release artifacts and prompt contracts
        run: python scripts/check-release.py
      - name: Check prototype JavaScript syntax
        run: |
          node --check prototype-v2/app.js
          node --check prototype-v2/auth.js
          node --check prototype-v2/studio.js
          node --check prototype-v2/canvas-agent.js
          node --check prototype-v2/workflow.js
          node --check prototype-v2/workflow-canvas.js
      - name: Build isolated deployment and test access gate
        run: |
          node scripts/build-cloudflare.mjs
          node scripts/test-cloudflare.mjs
          node scripts/test-production.mjs
          node scripts/test-integrations.mjs
          node scripts/test-studio-api.mjs
          node scripts/test-canvas-agent.cjs
          node scripts/test-workflow-canvas.cjs
          node scripts/test-workflow.mjs
          node scripts/test-workflow-api.mjs
          node scripts/test-pilot-budget.mjs
          node scripts/test-provider-preflight.mjs
          node scripts/test-provider-credentials.mjs
          node scripts/test-prompt-efficiency.mjs
          node scripts/test-media-runtime.mjs
          node scripts/test-media-budget.mjs
          node scripts/test-node-unification.cjs
          node scripts/test-autopilot-ui.cjs
          node scripts/test-autopilot.mjs
